name: Quality and security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    env:
      # La compilación no necesita conectarse a Supabase. Estos valores públicos
      # de marcador permiten validar el bundle en CI sin credenciales de despliegue.
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_ci_build_placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

  sonarqube:
    name: SonarQube analysis
    needs: build
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
    steps:
      - name: Require SonarQube Cloud configuration
        shell: bash
        run: |
          test -n "$SONAR_TOKEN" || { echo "::error::Configure the SONAR_TOKEN secret."; exit 1; }
          test -n "$SONAR_ORGANIZATION" || { echo "::error::Configure the SONAR_ORGANIZATION variable."; exit 1; }

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan with SonarQube
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}

  snyk-code:
    name: Snyk Code analysis
    needs: build
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Check Snyk configuration
        id: snyk-config
        shell: bash
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Snyk Code omitted: configure SNYK_TOKEN to enable it."
          fi

      - name: Checkout
        if: ${{ steps.snyk-config.outputs.enabled == 'true' }}
        uses: actions/checkout@v6

      - name: Set up Snyk CLI
        if: ${{ steps.snyk-config.outputs.enabled == 'true' }}
        uses: snyk/actions/setup@master

      - name: Scan source code
        if: ${{ steps.snyk-config.outputs.enabled == 'true' }}
        run: snyk code test
        env:
          SNYK_TOKEN: ${{ env.SNYK_TOKEN }}
